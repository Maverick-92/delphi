<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Delphi - Standalone Privacy Ledger Verifier</title>
  <style>
    body { background: #0b0f19; color: #e2e8f0; font-family: system-ui, sans-serif; padding: 30px; max-width: 820px; margin: 0 auto; }
    .box { background: #111827; border: 2px dashed #334155; border-radius: 12px; padding: 28px; text-align: center; margin: 20px 0; }
    .result { padding: 16px; border-radius: 10px; font-weight: 600; margin-top: 16px; display: none; }
    .ok { background: #14532d; color: #bbf7d0; border: 1px solid #22c55e; }
    .bad { background: #7f1d1d; color: #fecaca; border: 1px solid #ef4444; }
    pre { background: #0f172a; padding: 12px; border-radius: 8px; overflow-x: auto; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Delphi Receipt Verifier ("Don't Trust Us - Check")</h1>
  <p style="color:#94a3b8">100% browser-side SHA-256 chain check using WebCrypto. Zero backend calls.</p>
  <div class="box">
    <p>Select your exported <code>delphi_receipt.json</code> file:</p>
    <input type="file" id="fileInput" accept=".json" />
  </div>
  <div id="result" class="result"></div>
  <pre id="details"></pre>

<script>
async function sha256Hex(str) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

document.getElementById('fileInput').addEventListener('change', async (ev) => {
  const file = ev.target.files[0];
  if (!file) return;
  const parsed = JSON.parse(await file.text());
  const entries = parsed.entries || [];
  let expectedPrev = '0'.repeat(64);
  let tampered = null;

  for (const e of entries) {
    const raw = `${expectedPrev}|${e.ts}|${e.event_type}|${e.actor}|${e.destination}|${e.payload_sha256}|${e.outbound_json}`;
    const recomputed = await sha256Hex(raw);
    if (e.prev_hash !== expectedPrev || e.chain_hash !== recomputed) {
      tampered = { idx: e.idx, expected: recomputed, found: e.chain_hash };
      break;
    }
    expectedPrev = e.chain_hash;
  }

  const resBox = document.getElementById('result');
  resBox.style.display = 'block';
  if (!tampered) {
    resBox.className = 'result ok';
    resBox.textContent = `VERIFIED INTACT: All ${entries.length} ledger entries passed SHA-256 hash-chain verification.`;
    document.getElementById('details').textContent = `Chain Head Hash:\n${expectedPrev}`;
  } else {
    resBox.className = 'result bad';
    resBox.textContent = `TAMPERING DETECTED at ledger entry #${tampered.idx}!`;
    document.getElementById('details').textContent = JSON.stringify(tampered, null, 2);
  }
});
</script>
</body>
</html>
